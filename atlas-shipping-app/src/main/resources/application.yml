spring:
  application:
    name: atlas-shipping-app

  # Database configuration (RDS PostgreSQL)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:atlas_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    table: flyway_schema_history_shipping

  # OAuth2 Resource Server Config
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:https://example.com/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER_URI:https://example.com}

# AWS SNS settings (shipment lifecycle events)
aws:
  region: ${AWS_REGION:us-east-1}
  sns:
    topic-arn: ${AWS_SNS_TOPIC_ARN:arn:aws:sns:us-east-1:123456789012:shipment-events}
    endpoint-override: ${AWS_SNS_ENDPOINT_OVERRIDE:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    io.github.hsummerhays.atlas: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: INFO
