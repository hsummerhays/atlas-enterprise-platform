spring:
  application:
    name: inxpress-middleware
  
  # Database configuration (RDS PostgreSQL)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inxpress_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # OAuth2 Resource Server Config
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:https://example.com/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER_URI:https://example.com}

# AWS SNS/SQS/DynamoDB Settings
aws:
  region: ${AWS_REGION:us-east-1}
  sns:
    topic-arn: ${AWS_SNS_TOPIC_ARN:arn:aws:sns:us-east-1:123456789012:shipment-events}
    endpoint-override: ${AWS_SNS_ENDPOINT_OVERRIDE:}
    agent-review-topic-arn: ${AWS_SNS_AGENT_REVIEW_TOPIC_ARN:}
  sqs:
    endpoint-override: ${AWS_SQS_ENDPOINT_OVERRIDE:}
    agent-tasks-queue-url: ${AWS_SQS_AGENT_TASKS_QUEUE_URL:http://localhost:4566/000000000000/agent-tasks}
    agent-tasks-dlq-url: ${AWS_SQS_AGENT_TASKS_DLQ_URL:}
    agent-tasks-max-receive-count: ${AWS_SQS_MAX_RECEIVE_COUNT:3}
  dynamodb:
    endpoint-override: ${AWS_DYNAMODB_ENDPOINT_OVERRIDE:}
    audit-table-name: ${AWS_DYNAMODB_AUDIT_TABLE:agent-execution-audit}

# Claude AI settings
claude:
  api-key: ${CLAUDE_API_KEY:}
  model: claude-opus-4-8
  max-tokens: 4096

github:
  token: ${GITHUB_TOKEN:}
  owner: ${GITHUB_OWNER:}
  repo: ${GITHUB_REPO:}
  webhook-secret: ${GITHUB_WEBHOOK_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.inxpress.middleware: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: INFO
