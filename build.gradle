plugins {
    id 'org.springframework.boot' version '4.1.0' apply false // Using the latest Spring Boot 3.x/4.x compatible release for Java 25
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    group = 'io.github.hsummerhays.atlas'
    version = '0.0.1-SNAPSHOT'

    // Build with Java 25 toolchain, targeting Java 25 bytecode and APIs.
    // Developers benefit from the latest compiler tooling while production
    // remains on the Java 25 LTS runtime.
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }


    repositories {
        mavenCentral()
    }

    tasks.named('test') {
        useJUnitPlatform()
        jvmArgs '-XX:+EnableDynamicAgentLoading',
                '-Dnet.bytebuddy.experimental=true',
                '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
                '--add-opens', 'java.base/java.util=ALL-UNNAMED'
    }
}
