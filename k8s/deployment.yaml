apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-enterprise-platform
  namespace: shipping
  labels:
    app: atlas-enterprise-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: atlas-enterprise-platform
  template:
    metadata:
      labels:
        app: atlas-enterprise-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: middleware
        # ECR_REGISTRY and IMAGE_TAG are substituted by the CI/CD pipeline (envsubst) before apply.
        # IMAGE_TAG must be an immutable tag (e.g. the commit SHA), never `latest`.
        image: ${ECR_REGISTRY}/atlas-enterprise-platform:${IMAGE_TAG}
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8080
        env:
        - name: DB_HOST
          value: "atlas-rds.c123456789.us-east-1.rds.amazonaws.com"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "atlas_db"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
        - name: JWT_JWK_SET_URI
          value: "https://cognito-idp.us-east-1.amazonaws.com/us-east-1_xxxxxxxxx/.well-known/jwks.json"
        - name: JWT_ISSUER_URI
          value: "https://cognito-idp.us-east-1.amazonaws.com/us-east-1_xxxxxxxxx"
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_SNS_TOPIC_ARN
          value: "arn:aws:sns:us-east-1:123456789012:shipment-events"
        - name: AWS_SNS_AGENT_REVIEW_TOPIC_ARN
          value: "arn:aws:sns:us-east-1:123456789012:agent-review-events"
        - name: AWS_SQS_AGENT_TASKS_QUEUE_URL
          value: "https://sqs.us-east-1.amazonaws.com/123456789012/agent-tasks"
        - name: AWS_SQS_AGENT_TASKS_DLQ_URL
          value: "https://sqs.us-east-1.amazonaws.com/123456789012/agent-tasks-dlq"
        - name: AWS_DYNAMODB_AUDIT_TABLE
          value: "agent-execution-audit"
        - name: GITHUB_OWNER
          value: "atlas"
        - name: GITHUB_REPO
          value: "AtlasErpMiddleware"
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: agent-credentials
              key: github-token
        - name: GITHUB_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: agent-credentials
              key: github-webhook-secret
        - name: CLAUDE_API_KEY
          valueFrom:
            secretKeyRef:
              name: agent-credentials
              key: claude-api-key
        resources:
          limits:
            cpu: "1"
            memory: 1024Mi
          requests:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 20
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-enterprise-platform-service
  namespace: shipping
spec:
  selector:
    app: atlas-enterprise-platform
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atlas-enterprise-platform-ingress
  namespace: shipping
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # ACM_CERTIFICATE_ARN is substituted by the CI/CD pipeline (envsubst) before apply.
    alb.ingress.kubernetes.io/certificate-arn: ${ACM_CERTIFICATE_ARN}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: atlas-enterprise-platform-service
            port:
              number: 80
